name: CI

# Every push and every pull request. A gate that only runs on one of them is a
# gate someone can walk around.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. The older run's verdict is
# about code nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Read once here so a version bump is one edit rather than four.
  GO_VERSION: "1.26.1"
  NODE_VERSION: "22"

jobs:
  # ── Go ──────────────────────────────────────────────────────────────────────
  #
  # Split from the integration job so a compile error or a failing unit test is
  # reported in seconds, without waiting for Postgres to come up.
  go:
    name: Go — lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # `go tool`, not golangci-lint-action. The linter is pinned in go.mod
      # alongside goose and sqlc, so this runs the same version a laptop does —
      # an action that installs its own drifts, and the first anyone hears of it
      # is a pull request that is red for nobody's mistake.
      - name: Lint
        run: make lint

      # Named as its own step so an architecture violation is legible in the
      # checks list rather than buried in a test log. `go test ./...` below runs
      # the same package again, which costs a second and means a green suite is
      # green with the boundaries intact even if someone edits this file.
      #
      # depguard, in the lint step above, is the fast half of the same rules —
      # it catches a direct illegal import. This half follows the import graph,
      # so it catches a module reached through an intermediate package. Neither
      # subsumes the other; see docs/architecture.md.
      - name: Architecture boundaries
        run: make arch

      # The generated frontend contract must match the Go declarations it comes
      # from. This is the same TestGeneratedContractIsUpToDate that runs below;
      # naming it here is what makes the failure legible when someone changes a
      # bound and forgets `make contract`.
      - name: Tests
        run: go test ./... -race -cover

      # A go.mod or go.sum that `go mod tidy` would change means the committed
      # dependency set is not the one the code needs.
      - name: Dependencies are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # ── Integration ─────────────────────────────────────────────────────────────
  integration:
    name: Go — integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sladesk
          POSTGRES_PASSWORD: sladesk
          POSTGRES_DB: sladesk
        ports:
          - 5432:5432
        # Without this the job races the database: the first migration would
        # fail against a container that has not finished starting.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 5432 here, not the 5433 used locally. The local port is unusual because
      # this machine runs another project; a CI runner has nothing to collide
      # with.
      DATABASE_URL: postgres://sladesk:sladesk@localhost:5432/sladesk?sslmode=disable

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # make test-int applies the migrations first, and refuses to run at all
      # without DATABASE_URL — every integration test calls t.Skip without it,
      # and `go test` would print ok for a run that asserted nothing.
      - name: Integration tests
        run: make test-int

  # ── Web ─────────────────────────────────────────────────────────────────────
  web:
    name: Web — lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      # package_json_file, because the action reads the repository root by
      # default and this project has no package.json there — the Next app lives
      # in web/. The version itself comes from that file's packageManager field,
      # so CI and a laptop run the same pnpm, for the same reason golangci-lint
      # is pinned in go.mod.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --frozen-lockfile so a lockfile that disagrees with package.json fails
      # here rather than quietly installing something nobody chose.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      # The build type-checks, so this catches what tsc would. It needs no
      # credentials: measured, not assumed — `next build` with every Clerk and
      # API variable empty compiles and prerenders. The routes that need a
      # session are dynamic and are never prerendered.
      - name: Build
        run: pnpm build

  # ── End to end ──────────────────────────────────────────────────────────────
  #
  # The only test here that crosses every boundary at once: a real browser, a
  # real Clerk instance, a real HTTP call to the Go API, and a real row in
  # Postgres. Everything else mocks one of them.
  #
  # It runs against a **development** Clerk instance, never production. Signing
  # up needs `+clerk_test` addresses and the 424242 code, which only work while
  # Clerk's test mode is on — and turning test mode on in production lets
  # anybody bypass email verification on the live application. Production is
  # watched by the smoke workflow instead, which reads and never writes.
  e2e:
    name: End to end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sladesk
          POSTGRES_PASSWORD: sladesk
          POSTGRES_DB: sladesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://sladesk:sladesk@localhost:5432/sladesk?sslmode=disable
      # The browser talks to the API from localhost:3000, so the API has to
      # allow exactly that. The first local run of this suite used a different
      # port and every request was refused — the symptom was an empty ticket
      # list, not a CORS error, which is why the test now says so itself.
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Apply migrations
        run: make migrate-up

      # No webhook is delivered during this run, but the API refuses to start
      # without a parseable signing secret — deliberately, so a bad one stops a
      # deploy rather than turning into 500s nobody is watching. A syntactically
      # valid value is all this needs, so it is not a secret.
      - name: Start the API
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_DEV }}
          CLERK_WEBHOOK_SECRET: whsec_lzIrAAiI15CsoFs852lFmxfJ1xYXoQ5x
        run: |
          go run ./cmd/api &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health >/dev/null && exit 0
            sleep 1
          done
          echo "The API never became healthy." >&2
          exit 1

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        working-directory: web
        run: pnpm exec playwright install chromium --with-deps

      # Playwright's own webServer builds and starts Next. NEXT_PUBLIC_ values
      # are inlined at build time, so they have to be present here rather than
      # only when the server starts.
      - name: Run the end-to-end suite
        working-directory: web
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_DEV }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_DEV }}
        run: pnpm e2e

      # The trace is the only way to see what the page looked like, and it only
      # exists for a run that failed.
      - name: Keep the trace of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: web/test-results/
          retention-days: 7
