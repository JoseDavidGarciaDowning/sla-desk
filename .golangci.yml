version: "2"

# Pinned as a tool dependency in go.mod and run through `go tool`, like goose
# and sqlc. That is what keeps `make lint` and CI on the same version: a linter
# installed separately in CI drifts from the one on a laptop, and the first
# anyone hears of it is a pull request that is red for nobody's mistake.

linters:
  # The default set plus the ones below. Not "enable-all": a linter nobody
  # chose is a linter nobody can justify, and the noise gets suppressed rather
  # than fixed.
  enable:
    # Unchecked errors. The one that actually finds bugs.
    - errcheck
    # Reports errors created with fmt.Errorf that could wrap instead.
    - errorlint
    # Finds sync.WaitGroup and loop-variable mistakes in tests.
    - testifylint
    # Enforces that context.Context is the first parameter.
    - containedctx
    - govet
    # The architecture rules, fast half. depguard reads one file's import block
    # and catches a direct illegal import in seconds, on every lint run and
    # every CI run. The slow half is internal/architecture, which follows the
    # import graph and so catches a module reached through two hops. Neither
    # subsumes the other — verified by injecting both shapes — and a rule held
    # by only one of them is a rule that lasts until someone adds a hop.
    - depguard

  # govet's `shadow` analyzer is deliberately NOT enabled. It was, briefly, and
  # it produced two findings — both on `if err := f(); err != nil`, which is the
  # most common idiom in the language and is safe precisely because the shadowed
  # binding cannot escape the if. Satisfying it would mean rewriting correct
  # code, or carrying suppressions next to it. The bug it is meant to catch —
  # an outer err that is never checked because an inner one took its name — is
  # already caught by errcheck.

  settings:
    depguard:
      # ── The architecture rules (docs/adr/0005, docs/architecture.md) ────────
      #
      # Every deny below is a rule someone would otherwise have to remember.
      # The messages say what to do instead, because a lint failure that only
      # says "forbidden" gets suppressed rather than fixed.
      #
      # `files` matches the file being linted; `deny.pkg` is a prefix on the
      # import path. Test files are covered deliberately: a test that reaches
      # across a boundary is a boundary that does not hold, and it is the
      # easiest place for one to be breached.
      rules:
        # ── Module boundaries ──────────────────────────────────────────────
        ticket-module:
          files: ["**/internal/modules/ticket/**"]
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/sla
              desc: >-
                The ticket module must not import the SLA module. Declare what
                you need as a contract in ticket/application (see SLAPolicies)
                and wire the implementation in internal/app.
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/identity
              desc: >-
                The ticket module must not import the identity module. It
                declares CallerResolver in ticket/transport/http for exactly
                this; internal/app supplies one.

        sla-module:
          files: ["**/internal/modules/sla/**"]
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/ticket
              desc: >-
                The SLA module must not import the ticket module. It works in
                running and paused phases, not in ticket statuses — which
                statuses burn budget is the ticket module's decision.
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/identity
              desc: The SLA module has no business knowing who a user is.

        identity-module:
          files: ["**/internal/modules/identity/**"]
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/ticket
              desc: >-
                The identity module must not import the ticket module. It
                answers who someone is; what that means on a ticket is decided
                in internal/app.
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/sla
              desc: The identity module has no business knowing about SLAs.

        # ── The composition root is a sink, never a source ─────────────────
        nothing-imports-the-composition-root:
          files: ["**", "!**/internal/app/**", "!**/cmd/**"]
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/app
              desc: >-
                internal/app is the composition root. Only cmd may build it. A
                module needing something from another module declares a
                contract instead.

        # ── Shared code stays cross-cutting ────────────────────────────────
        platform-knows-no-business:
          files: ["**/internal/platform/**"]
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules
              desc: >-
                internal/platform must not import a business module. If it
                needs to know what a ticket is, it is not platform code — move
                it into the module whose concept it is.
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/app
              desc: internal/platform sits below the composition root, not above it.

        # ── The vertical slice invariant (rule 8) ──────────────────────────
        #
        # One rule per feature, each saying the same thing: this feature is
        # private to itself. The architecture test asserts it too, on the
        # transitive graph — but the graph walk uses the default build context
        # and cannot see files behind //go:build integration, which is exactly
        # where a feature borrowing a neighbour's fixture would hide. Enabling
        # depguard once found seven such imports the graph walk had been
        # passing over (docs/architecture.md).
        #
        # The negated glob is what keeps this to one deny per feature rather
        # than one per pair: every feature file in the module, except the
        # feature's own, is refused the import.
        identity-feature-assignable-is-private:
          files:
            - "**/internal/modules/identity/features/**"
            - "!**/internal/modules/identity/features/assignable/**"
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/identity/features/assignable
              desc: >-
                A feature is a use case, and a use case that needs its
                neighbour is not one. Move what they share below them both:
                a rule into identity/domain, a contract into identity/ports,
                a wire shape into identity/transport/http.
        identity-feature-me-is-private:
          files:
            - "**/internal/modules/identity/features/**"
            - "!**/internal/modules/identity/features/me/**"
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/identity/features/me
              desc: >-
                A feature is a use case, and a use case that needs its
                neighbour is not one. Move what they share below them both:
                a rule into identity/domain, a contract into identity/ports,
                a wire shape into identity/transport/http.
        identity-feature-provision-is-private:
          files:
            - "**/internal/modules/identity/features/**"
            - "!**/internal/modules/identity/features/provision/**"
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/identity/features/provision
              desc: >-
                A feature is a use case, and a use case that needs its
                neighbour is not one. Move what they share below them both:
                a rule into identity/domain, a contract into identity/ports,
                a wire shape into identity/transport/http.
        sla-feature-resolve-is-private:
          files:
            - "**/internal/modules/sla/features/**"
            - "!**/internal/modules/sla/features/resolve/**"
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/sla/features/resolve
              desc: >-
                A feature is a use case, and a use case that needs its
                neighbour is not one. Move what they share below them both:
                a rule into sla/domain, a contract into sla/ports,
                a wire shape into sla/transport/http.
        ticket-feature-assign-is-private:
          files:
            - "**/internal/modules/ticket/features/**"
            - "!**/internal/modules/ticket/features/assign/**"
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/ticket/features/assign
              desc: >-
                A feature is a use case, and a use case that needs its
                neighbour is not one. Move what they share below them both:
                a rule into ticket/domain, a contract into ticket/ports,
                a wire shape into ticket/transport/http.
        ticket-feature-create-is-private:
          files:
            - "**/internal/modules/ticket/features/**"
            - "!**/internal/modules/ticket/features/create/**"
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/ticket/features/create
              desc: >-
                A feature is a use case, and a use case that needs its
                neighbour is not one. Move what they share below them both:
                a rule into ticket/domain, a contract into ticket/ports,
                a wire shape into ticket/transport/http.
        ticket-feature-get-is-private:
          files:
            - "**/internal/modules/ticket/features/**"
            - "!**/internal/modules/ticket/features/get/**"
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/ticket/features/get
              desc: >-
                A feature is a use case, and a use case that needs its
                neighbour is not one. Move what they share below them both:
                a rule into ticket/domain, a contract into ticket/ports,
                a wire shape into ticket/transport/http.
        ticket-feature-history-is-private:
          files:
            - "**/internal/modules/ticket/features/**"
            - "!**/internal/modules/ticket/features/history/**"
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/ticket/features/history
              desc: >-
                A feature is a use case, and a use case that needs its
                neighbour is not one. Move what they share below them both:
                a rule into ticket/domain, a contract into ticket/ports,
                a wire shape into ticket/transport/http.
        ticket-feature-list-is-private:
          files:
            - "**/internal/modules/ticket/features/**"
            - "!**/internal/modules/ticket/features/list/**"
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/ticket/features/list
              desc: >-
                A feature is a use case, and a use case that needs its
                neighbour is not one. Move what they share below them both:
                a rule into ticket/domain, a contract into ticket/ports,
                a wire shape into ticket/transport/http.
        ticket-feature-queue-is-private:
          files:
            - "**/internal/modules/ticket/features/**"
            - "!**/internal/modules/ticket/features/queue/**"
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/ticket/features/queue
              desc: >-
                A feature is a use case, and a use case that needs its
                neighbour is not one. Move what they share below them both:
                a rule into ticket/domain, a contract into ticket/ports,
                a wire shape into ticket/transport/http.
        ticket-feature-transition-is-private:
          files:
            - "**/internal/modules/ticket/features/**"
            - "!**/internal/modules/ticket/features/transition/**"
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/modules/ticket/features/transition
              desc: >-
                A feature is a use case, and a use case that needs its
                neighbour is not one. Move what they share below them both:
                a rule into ticket/domain, a contract into ticket/ports,
                a wire shape into ticket/transport/http.

        # ── Layer direction inside a module ────────────────────────────────
        domain-depends-on-nothing:
          files: ["**/internal/modules/*/domain/**"]
          deny:
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/app
              desc: A domain package must not know the composition root exists.
            - pkg: github.com/JoseDavidGarciaDowning/sla-desk/internal/platform
              desc: >-
                A domain package imports no infrastructure, not even ours.
                Everything it needs is an argument — that is what keeps it
                testable with nothing running.
            - pkg: github.com/jackc/pgx
              desc: >-
                The domain has no database. A driver type in a domain struct is
                how "testable with nothing running" stops being true.
            - pkg: database/sql
              desc: The domain has no database.
            - pkg: net/http
              desc: >-
                The domain has no HTTP. Status codes and request shapes belong
                in transport.
            - pkg: github.com/go-chi/chi
              desc: The domain has no router.
            - pkg: github.com/clerk/clerk-sdk-go
              desc: The domain has no third-party SDK.

        application-depends-on-no-implementation:
          files: ["**/internal/modules/*/application/**"]
          deny:
            - pkg: github.com/jackc/pgx
              desc: >-
                The application layer names no driver type. If a port needs an
                id, give it one the domain owns.
            - pkg: net/http
              desc: >-
                The application layer decides no status codes. Return an error
                the transport layer can map.
            - pkg: github.com/go-chi/chi
              desc: The application layer has no router.

  exclusions:
    # The generated store is sqlc's output. Linting code we do not write means
    # either editing generated files — which the next `make sqlc` discards — or
    # carrying suppressions for somebody else's style.
    paths:
      - internal/store/.*\.sql\.go$

    rules:
      # QF1008 wants key.PublicKey.N shortened to key.N, because PublicKey is
      # embedded. In internal/api/router_test.go the explicit selector is the
      # point: that test builds a JWKS, and naming PublicKey is what says only
      # the public half of the key is being published. Shorter, and less clear
      # about the one thing worth being clear about.
      #
      # A style quickfix, not a correctness check, and this is the disagreement
      # rather than an oversight.
      - linters: [staticcheck]
        text: "QF1008"

      # Test files may ignore errors from helpers whose failure the assertions
      # would catch anyway. Production code may not.
      - path: _test\.go
        linters: [errcheck]

      # containedctx exists because a Context stored on a long-lived object ties
      # one request's cancellation and deadline to something that outlives it.
      # The integration tests' testContext bundles ctx, tx and q so their helpers
      # take one argument instead of four, and it lives for exactly one test —
      # the failure mode the rule guards against cannot happen. In production
      # code it stays on.
      - path: _test\.go
        linters: [containedctx]

formatters:
  enable:
    - gofmt
    # Stricter than gofmt: also groups imports and removes empty lines that
    # gofmt tolerates. `make fmt` applies it.
    - gofumpt

  settings:
    gofumpt:
      module-path: github.com/JoseDavidGarciaDowning/sla-desk

  exclusions:
    paths:
      - internal/store/.*\.sql\.go$
